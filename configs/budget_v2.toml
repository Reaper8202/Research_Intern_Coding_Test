# Round 2 (plan revision 2.5, D36). Written on 2 November 2026 before any score of these runs.
# Derek asked for model improvement within the assessment rules, and for a self-audit.
#
# Evidence for this round, from training data only:
# * DALY, QALY, and QOLS are simulator scores recorded yearly from 2011. Code counts predict an
#   anchor before 2015 with AUROC 0.999, and 1,155 of those 1,219 training patients died.
# * Those patients have more new diagnoses (2.37 against 1.48 per patient). So the codes let a
#   model read how the anchor was built. LightGBM falls from 0.773 to 0.762 AUROC without them.
# * Fine-tuning overfits; dropout 0.3 was the top of the tested range.
# * The head reads only the last event; the largest LightGBM gaps are on count-driven conditions.
#
# Exclusion is a validity correction under D3 and D10, so it does not depend on the score. A0 and
# A1 measure its cost. All other experiments use the section 5.3 rule against their reference.
# Official val is not read.
#
# Planned next, each appended here before its scores: extra supervised anchors (E3), full-timeline
# pretraining (reverses D16, so adoption needs Derek's approval), one combination, and seeds of
# the final configuration for a measured ensemble.

incumbent = "configs/experiments/mm_dropout03.toml"
method = "F"
compute_ceiling_hours = 14
combination_slots = 1

[[experiment]]
id = "A0-clean-base"
config = "configs/v2_base.toml"
reference = "configs/multimodal.toml"
folds = [0, 1, 2, 3, 4]

[[experiment]]
id = "A1-clean-dropout03"
config = "configs/experiments/v2_do03.toml"
folds = [0, 1, 2, 3, 4]

[[experiment]]
id = "A2-dropout05"
config = "configs/experiments/v2_do05.toml"
reference = "configs/experiments/v2_do03.toml"
folds = [0, 1, 2, 3, 4]

[[experiment]]
id = "A3-pooled-readout"
config = "configs/experiments/v2_pool.toml"
reference = "configs/experiments/v2_do03.toml"
folds = [0, 1, 2, 3, 4]

# Added on 2 November 2026, before any score of these runs and before A0 to A3 finished.
# X1: extra anchors answer the overfitting evidence (2,232 supervised examples). A real-data check
# before any training showed cut days across the whole history were far from real anchors (age 39
# against 61; positive rate 1.0% against 5.1%). So cut days use the latest allowed five years (age
# 57; 3.1%) and a head input marks these examples. Held-out scoring uses real anchors only.
# P2: Derek asked whether pretraining limits the model. Pretraining reads fit patients' full
# timelines; 27 to 37 percent of rows in the checked tables lie after the anchor. Held-out, val,
# and test patients stay out, and inputs stay cut. Adoption reverses D16, so it needs Derek.

[[experiment]]
id = "X1-extra-anchors"
config = "configs/experiments/v2_xa.toml"
reference = "configs/experiments/v2_do03.toml"
folds = [0, 1, 2, 3, 4]

[[experiment]]
id = "P2a-full-timeline-parent"
config = "configs/experiments/v2_ftl_pre.toml"
reference = "configs/v2_base.toml"
folds = [0, 1, 2, 3, 4]

[[experiment]]
id = "P2b-full-timeline-dropout03"
config = "configs/experiments/v2_ftl.toml"
reference = "configs/experiments/v2_do03.toml"
folds = [0, 1, 2, 3, 4]

# Added on 2 November 2026 at 19:29, before any score of these runs. Evidence: on clean inputs, 10
# of 40 targets stay near chance for every model (best AUROC mean 0.558). The largest fixable gaps
# to LightGBM are count-driven (colon polyp 0.769 against 0.861; myocardial infarction 0.802
# against 0.890). X1 and A3 both gained on 4 of 5 folds but stayed below the 0.005 rule. Target
# diagnoses are the hardest pretraining tokens (held-out loss about 2.6 against 1.4 overall).
# Target number: none. A CV score of 0.80 is not a goal; the plan forbids promising a score.
# Stopping rule: after these runs, one combination and the seeds of its result. No more trials.

[[experiment]]
id = "F1-count-branch"
config = "configs/experiments/v2_count.toml"
reference = "configs/experiments/v2_do03.toml"
folds = [0, 1, 2, 3, 4]

[[experiment]]
id = "F2-target-weights"
config = "configs/experiments/v2_tw.toml"
reference = "configs/experiments/v2_do03.toml"
folds = [0, 1, 2, 3, 4]

[[experiment]]
id = "P3a-weighted-parent"
config = "configs/experiments/v2_ptw_pre.toml"
reference = "configs/v2_base.toml"
folds = [0, 1, 2, 3, 4]

[[experiment]]
id = "P3b-weighted-parent-dropout03"
config = "configs/experiments/v2_ptw.toml"
reference = "configs/experiments/v2_do03.toml"
folds = [0, 1, 2, 3, 4]
