# G2 pipeline smoke test with the D34 modalities: same code paths, tiny sizes. Not a result.
name = "smoke-mm"
seed = 20261028

[representation]
context_length = 256
max_summary_tokens = 32
min_patients = 5
refill_gap_days = 1.0

[modalities]
genomics = true
imaging = true
image_size = 64

[model]
n_layers = 2
d_model = 32
n_heads = 4
ff_mult = 4
dropout = 0.1
head_dropout = 0.1

[pretrain]
batch_size = 16
micro_batch_size = 4
max_epochs = 2
patience = 3
lr = 0.001
warmup_fraction = 0.1
final_lr_fraction = 0.1
weight_decay = 0.1
betas = [0.9, 0.95]
grad_clip = 1.0
eval_seed = 20261028

[finetune]
batch_size = 16
micro_batch_size = 4
max_epochs = 2
patience = 5
head_lr = 0.001
body_lr_S = 0.0003
body_lr_F = 0.0001
weight_decay = 0.01
grad_clip = 1.0

[runtime]
device = "cpu"
wandb = "disabled"
max_steps_per_epoch = 4
max_fit_patients = 96
max_held_patients = 64
eval_batch_size = 32
